<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>科能未来金刚--浦东校区张老师学员作业发布中心</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3f6fb;color:#1b2a4a}
header{background:#1b2a4a;color:#fff;text-align:center;padding:22px 12px}
h1{margin:0;font-size:22px}
header p{margin:6px 0 0;color:#a9b8d8;font-size:13px}
main{max-width:760px;margin:18px auto;padding:0 14px}
.box,.card{background:#fff;border:1px solid #dde4f0;border-radius:10px;padding:16px;margin-bottom:14px}
.box{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
select,button{font:inherit;padding:6px 10px;border:1px solid #c5cfe3;border-radius:8px;background:#fff;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #ff7a1a;outline-offset:2px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#e8eefb;color:#2c4a8a;margin:0 6px 6px 0}
.tag.p{background:#ffe9d2;color:#9a4a00}.tag.u{background:#ffe0e0;color:#b42323}.tag.ok{background:#d7f3e6;color:#13744d}
.card.u{border-color:#f0a5a5}.card.d{border-color:#7fd1ab}.card.p{border-color:#ffc58a}
.card h2{font-size:17px;margin:2px 0 8px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.subs{background:#f3f6fb;border-radius:8px;padding:6px 12px;margin:8px 0}
.subs label{display:flex;gap:8px;padding:5px 0;cursor:pointer}
.subs .x{text-decoration:line-through;color:#8a97b3}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #e8edf6;padding-top:10px;margin-top:8px;font-size:12px;color:#8a97b3}
.tip{text-align:center;color:#8a97b3;padding:20px}.small{font-size:12px;padding:6px}
a{color:#2c4a8a}

/* 课前作业提醒弹窗 */
.reminder-mask{position:fixed;inset:0;z-index:9999;background:rgba(15,25,45,.58);display:flex;align-items:center;justify-content:center;padding:16px}
.reminder-mask[hidden]{display:none}
.reminder-dialog{width:min(100%,560px);max-height:86vh;overflow:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 18px 55px rgba(0,0,0,.25)}
.reminder-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.reminder-head h2{font-size:19px;margin:0;color:#1b2a4a}
.reminder-close{border:0;background:#eef2f8;border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1;color:#52617c;padding:0}
.reminder-countdown{background:#f1f5fb;border:1px solid #e1e8f3;border-radius:12px;padding:16px 10px;text-align:center;margin-bottom:16px}
.reminder-countdown-label{font-size:13px;color:#687895;margin-bottom:10px}
.reminder-clock{display:flex;justify-content:center;align-items:baseline;gap:5px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.reminder-clock strong{font-size:clamp(25px,7vw,38px);line-height:1.1;color:#16845b;font-weight:750}
.reminder-clock span{font-size:13px;color:#64728c;margin-right:5px}
.reminder-clock.expired strong{color:#c24141}
.reminder-deadline{font-size:12px;color:#8290a8;margin-top:9px}
.reminder-section-title{font-size:14px;font-weight:700;color:#263858;margin:0 0 9px}
.reminder-list{display:grid;gap:8px}
.reminder-item{border:1px solid #e2e8f2;border-radius:9px;padding:10px 12px;background:#fff}
.reminder-item-class{font-size:11px;color:#71809b;margin-bottom:3px}
.reminder-item-title{font-size:14px;color:#263858;line-height:1.55;overflow-wrap:anywhere}
.reminder-empty{font-size:13px;color:#8390a6;text-align:center;padding:12px 4px}
.reminder-note{font-size:11px;color:#9aa5b8;text-align:center;margin:12px 0 0}
@media(max-width:420px){.reminder-dialog{padding:16px}.reminder-clock{gap:3px}.reminder-clock strong{font-size:28px}}

</style>
</head>
<body>
<header>
  <h1>🚀 科能未来金刚--浦东校区张老师学员作业发布中心</h1>
  <p>选择班级和姓名，逐题勾选，完成打卡</p>
</header>
<main>
  <div class="box">
    <label>📍 班级 <select id="cls"><option value="">-- 请选择班级 --</option></select></label>
    <label>👤 姓名 <select id="stu" disabled><option value="">-- 请先选择班级 --</option></select></label>
    <button id="reset" hidden>🔄 切换班级/姓名</button>
  </div>
  <div id="list"></div>
  <p id="tip" class="tip">请先选择班级和姓名，查看你的作业</p>
  <p id="upd" class="tip small"></p>
</main>

<div id="reminderMask" class="reminder-mask" hidden role="dialog" aria-modal="true" aria-labelledby="reminderTitle">
  <div class="reminder-dialog">
    <div class="reminder-head">
      <h2 id="reminderTitle">📚 本次课前作业提醒</h2>
      <button type="button" id="reminderClose" class="reminder-close" aria-label="关闭">×</button>
    </div>
    <div class="reminder-countdown">
      <div class="reminder-countdown-label" id="reminderCountdownLabel">距离本次作业截止还有</div>
      <div class="reminder-clock" id="reminderClock"><strong>--</strong><span>天</span><strong>--</strong><span>时</span><strong>--</strong><span>分</span><strong>--</strong><span>秒</span></div>
      <div class="reminder-deadline" id="reminderDeadline"></div>
    </div>
    <div class="reminder-section-title">以下是你还没有完成的作业：</div>
    <div id="reminderList" class="reminder-list"></div>
    <p class="reminder-note">完成并勾选的项目会保存在本设备，下次打开时不再重复提醒。</p>
  </div>
</div>

<script>
const GRACE = 3; // 超期超过几天后不再显示
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const hash = s => { let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
let D = { roster: {}, homework: [], archivedClasses: {} };
let reminderTimer = null;
let reminderDeadline = null;
function isArchivedClass(cls){const a=D.archivedClasses||{};return Array.isArray(a)?a.includes(cls):!!a[cls];}

// 日期加天数：优先使用教师设置的实际截止日期，否则按发布日 + 7 天计算
function addDays(dateStr, days){
  if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return '';
  const [y,m,d] = dateStr.split('-').map(Number);
  const x = new Date(y, m-1, d + days);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
// 作业按“截止日期 + 原有宽限期 + 老师为该学生设置的延期天数”决定是否继续显示
function dueInfo(hw, student){
  const baseDue = hw.dueDate || addDays(hw.date, 7);
  const [y,m,d] = baseDue.split('-').map(Number);
  const ext = Math.max(0, Number(hw.extensions && hw.extensions[student]) || 0);
  // 缺课延期会把“实际截止日”整体向后移动，而不只是延长卡片的隐藏时间。
  const effectiveDue = new Date(y, m-1, d + ext);
  const today = new Date(); today.setHours(0,0,0,0);
  const n = Math.round((effectiveDue - today) / 864e5);
  const visibleUntil = new Date(y, m-1, d + ext + GRACE);
  const visibleDays = Math.round((visibleUntil - today) / 864e5);
  let text;
  if(ext>0){
    if(n>0) text=`📅 缺课延期 +${ext} 天 · 剩余 ${n} 天`;
    else if(n===0) text=`📅 缺课延期 +${ext} 天 · 今天截止`;
    else text=`⚠️ 延期后仍已超期 ${Math.abs(n)} 天`;
  }else if(n<0) text='⚠️ 已超期';
  else if(n===0) text='🔥 今天截止';
  else if(n<=2) text=`⏰ 仅剩 ${n} 天`;
  else text=`⏳ 剩余 ${n} 天`;
  const urgent=n<=2;
  return {n,visibleDays,text,urgent,effectiveDue:addDays(baseDue,ext),extensionDays:ext};
}
const subKey = (stu, hw, text) => `done_${stu}_${hw.id}_${hash(text)}`;

// 班级名称中包含固定上课星期和时间，例如“周日 14:30”。
function getClassSchedule(className){
  const m = String(className || '').match(/周([一二三四五六日天])\s*(\d{1,2}):(\d{2})/);
  if(!m) return null;
  const weekMap = {'日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
  const hour = Number(m[2]), minute = Number(m[3]);
  if(hour<0 || hour>23 || minute<0 || minute>59) return null;
  return {weekday:weekMap[m[1]], hour, minute};
}
function parseLocalDate(dateStr){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(dateStr||''))) return null;
  const [y,m,d] = dateStr.split('-').map(Number);
  const date = new Date(y,m-1,d);
  if(date.getFullYear()!==y || date.getMonth()!==m-1 || date.getDate()!==d) return null;
  return date;
}
function formatLocalDate(date){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
// 截止时间必须根据“这份作业对应的上课日期”计算，不能根据打开网页当天计算。
// 例如作业对应日期为上周六，本周六课程一开始，这份作业就已经超时。
// 不能因为本周课程已开始而自动把旧作业顺延到下周。
// 教师为学生延期 +7 天时，再把对应截止课程顺延 7 天。
function getHomeworkDeadline(hw, student){
  const schedule = getClassSchedule(hw.className);
  if(!schedule) return null;
  const baseDate = parseLocalDate(hw.lessonDate || hw.date);
  if(!baseDate) return null;

  // 从作业对应的上课日期出发，找严格晚于该日期的下一次同班课程。
  // 如果作业对应日期本身就是上课日，则下一次课程是 7 天后。
  let daysToNextLesson = (schedule.weekday - baseDate.getDay() + 7) % 7;
  if(daysToNextLesson === 0) daysToNextLesson = 7;
  const lessonDate = new Date(baseDate.getFullYear(),baseDate.getMonth(),baseDate.getDate()+daysToNextLesson);
  lessonDate.setHours(schedule.hour,schedule.minute,0,0);

  const ext = Math.max(0, Number(hw.extensions && hw.extensions[student]) || 0);
  if(ext) lessonDate.setDate(lessonDate.getDate()+ext);
  const deadline = new Date(lessonDate.getTime()-60000); // 上课前一分钟截止
  return {deadline, lessonDate, extensionDays:ext};
}
function formatCountdown(ms){
  const total = Math.max(0, Math.floor(ms/1000));
  const days = Math.floor(total/86400);
  const hours = Math.floor(total%86400/3600);
  const minutes = Math.floor(total%3600/60);
  const seconds = total%60;
  return `<strong>${String(days).padStart(2,'0')}</strong><span>天</span><strong>${String(hours).padStart(2,'0')}</strong><span>时</span><strong>${String(minutes).padStart(2,'0')}</strong><span>分</span><strong>${String(seconds).padStart(2,'0')}</strong><span>秒</span>`;
}
function getPendingHomework(cls, stu){
  const now = new Date();
  const rows = [];
  for(const h of D.homework){
    if(h.className !== cls || ![].concat(h.target || []).some(t => t === '全班' || t === stu)) continue;
    const items = Array.isArray(h.items) ? h.items : [];
    const pending = items.filter(t => store.get(subKey(stu,h,t)) !== '1');
    if(!pending.length) continue;
    const oldVisibility = dueInfo(h,stu);
    if(oldVisibility.visibleDays < 0) continue;
    const due = getHomeworkDeadline(h,stu);
    if(!due) continue;

    // 关键修改：截止时间一到，立即停止提醒。
    // 已经超时的作业不再进入提醒弹窗，也不再参与顶部倒计时。
    if(due.deadline.getTime() <= now.getTime()) continue;

    rows.push({h,pending,due});
  }
  return rows;
}
function updateReminderCountdown(){
  if(!reminderDeadline) return;
  const now = new Date();
  const diff = reminderDeadline.getTime() - now.getTime();
  const clock = $('reminderClock');
  if(diff > 0){
    clock.classList.remove('expired');
    clock.innerHTML = formatCountdown(diff);
    $('reminderCountdownLabel').textContent = '距离最新一份未完成作业截止还有';
  }else{
    clock.classList.add('expired');
    const elapsed = Math.abs(diff);
    clock.innerHTML = formatCountdown(elapsed);
    $('reminderCountdownLabel').textContent = '最新一份未完成作业已截止，超时';
  }
}
function renderReminder(){
  const cls = $('cls').value, stu = $('stu').value;
  if(!cls || !stu) return false;
  const rows = getPendingHomework(cls,stu);
  const list = $('reminderList');
  if(!rows.length){
    list.innerHTML = '<div class="reminder-empty">太棒了！目前没有需要提醒的未完成作业。</div>';
    reminderDeadline = null;
    $('reminderClock').innerHTML = '';
    $('reminderCountdownLabel').textContent = '目前没有需要提醒的作业';
    $('reminderDeadline').textContent = '';
    if(reminderTimer){clearInterval(reminderTimer);reminderTimer=null;}
    return false;
  }

  // 按布置日期从新到旧排序：顶部倒计时对应最新一份未超时的未完成作业。
  rows.sort((a,b)=>String(b.h.date||'').localeCompare(String(a.h.date||'')));
  const latest = rows[0];
  reminderDeadline = latest.due.deadline;

  list.innerHTML = rows.flatMap(({h,pending})=>pending.map(item=>{
    const title = h.title ? `${h.title}：` : '';
    return `<div class="reminder-item"><div class="reminder-item-class">${esc(h.className)} · ${[].concat(h.target||[]).includes('全班')?'全班作业':'个人作业'} · 布置日期：${esc(h.date||'')}</div><div class="reminder-item-title">${esc(title + item)}</div></div>`;
  })).join('');

  $('reminderCountdownLabel').textContent = '距离最新一份未完成作业截止还有';
  $('reminderDeadline').textContent = `最新作业截止时间：${latest.due.deadline.toLocaleString('zh-CN',{hour12:false})}`;
  updateReminderCountdown();
  return true;
}
function showHomeworkReminder(){
  if(!renderReminder()){
    $('reminderMask').hidden = true;
    return;
  }
  $('reminderMask').hidden = false;
  if(reminderTimer) clearInterval(reminderTimer);
  reminderTimer = setInterval(()=>{
    // 每秒刷新倒计时和提醒清单；超时的作业会自动从提醒中消失。
    if(!renderReminder()){$('reminderMask').hidden=true;return;}
    updateReminderCountdown();
  },1000);
}
function closeHomeworkReminder(){
  $('reminderMask').hidden = true;
  if(reminderTimer){clearInterval(reminderTimer);reminderTimer=null;}
}

function render(){
  const cls = $('cls').value, stu = $('stu').value, box = $('list'), tip = $('tip');
  box.innerHTML = '';
  if (!cls || !stu) { tip.textContent = '请先选择班级和姓名，查看你的作业'; tip.hidden = false; return; }
  const rows = D.homework
    .filter(h => h.className === cls && [].concat(h.target).some(t => t === '全班' || t === stu))
    .map(h => ({h, due: dueInfo(h, stu)}))
    .filter(r => r.due.visibleDays >= 0)
    .sort((a,b) => b.h.date.localeCompare(a.h.date));
  tip.hidden = rows.length > 0;
  tip.textContent = '本周暂无作业';
  box.innerHTML = rows.map(({h, due}) => {
    const personal = ![].concat(h.target).includes('全班');
    const done = h.items.filter(t => store.get(subKey(stu, h, t)) === '1').length;
    const all = done === h.items.length;
    const cardCls = all ? 'd' : due.urgent ? 'u' : personal ? 'p' : '';
    const subs = h.items.map(t => {
      const k = subKey(stu, h, t), on = store.get(k) === '1';
      return `<label><input type="checkbox" data-k="${esc(k)}" ${on ? 'checked' : ''}><span class="${on ? 'x' : ''}">${esc(t)}</span></label>`;
    }).join('');
    const link = /^https?:\/\//.test(h.link || '') ? `<p><a href="${esc(h.link)}" target="_blank" rel="noopener noreferrer">🔗 参考链接 / 提交入口</a></p>` : '';
    const text = (h.title ? h.title + '\n' : '') + h.items.map((t,i) => `${i+1}. ${t}`).join('\n');
    return `<div class="card ${cardCls}">
      <div class="top"><div>
        <span class="tag">${esc(h.className)}</span>
        <span class="tag ${personal ? 'p' : ''}">${personal ? '🎯 专属任务' : '📢 全班作业'}</span>
        <span class="tag ${due.urgent ? 'u' : ''}">${due.text}</span>
      </div><span class="small">发布：${esc(h.date)}</span></div>
      ${h.title ? `<h2>${esc(h.title)}</h2>` : ''}
      <span class="tag ${all ? 'ok' : 'p'}">${all ? '🎉 已全部完成' : `进度 ${done}/${h.items.length}`}</span>
      <div class="subs">${subs}</div>${link}
      <div class="foot"><button data-copy="${esc(text)}">📋 一键复制作业</button><span>勾选记录保存在本设备</span></div>
    </div>`;
  }).join('');
}

function copyText(text, btn){
  const ok = () => { btn.textContent = '✨ 已复制'; setTimeout(() => btn.textContent = '📋 一键复制作业', 2000); };
  const fallback = () => {
    const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); ok(); } catch(e) { alert('复制失败，请手动复制'); }
    a.remove();
  };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}

function fillStudents(selected){
  const cls = $('cls').value, s = $('stu');
  s.innerHTML = '<option value="">-- 请选择姓名 --</option>' +
    (D.roster[cls] || []).map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  s.disabled = !cls;
  if (!cls) s.innerHTML = '<option value="">-- 请先选择班级 --</option>';
  if (selected && (D.roster[cls] || []).includes(selected)) s.value = selected;
}

function saveSel(){
  const c = $('cls').value, s = $('stu').value;
  if (c && s) { store.set('sel_cls', c); store.set('sel_stu', s); $('reset').hidden = false; }
}

function init(){
  const activeClasses=Object.keys(D.roster||{}).filter(c=>!isArchivedClass(c)).sort((a,b)=>a.localeCompare(b,'zh-CN'));
  $('cls').insertAdjacentHTML('beforeend', activeClasses.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join(''));
  const c = store.get('sel_cls'), s = store.get('sel_stu');
  if (c && !isArchivedClass(c) && D.roster[c] && (D.roster[c]).includes(s)) {
    $('cls').value = c; fillStudents(s); $('reset').hidden = false;
  } else if (c && isArchivedClass(c)) { store.del('sel_cls'); store.del('sel_stu'); }
  if (!activeClasses.length) $('tip').textContent='目前没有正常上课的班级；已结课班级的历史记录仍由老师保留。';
  if (D.updated) $('upd').textContent = '作业最后更新：' + new Date(D.updated).toLocaleString('zh-CN', {hour12:false});
  render();
  if($('cls').value && $('stu').value) showHomeworkReminder();
}

$('cls').addEventListener('change', () => { fillStudents(); render(); });
$('stu').addEventListener('change', () => { saveSel(); render(); showHomeworkReminder(); });
$('reset').addEventListener('click', () => {
  store.del('sel_cls'); store.del('sel_stu');
  closeHomeworkReminder();
  $('cls').value = ''; fillStudents(); $('reset').hidden = true; render();
});
$('list').addEventListener('change', e => {
  const k = e.target.dataset.k;
  if (k) { store.set(k, e.target.checked ? '1' : '0'); render(); if(!$('reminderMask').hidden) showHomeworkReminder(); }
});
$('list').addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (b) copyText(b.dataset.copy, b);
});
$('reminderClose').addEventListener('click', closeHomeworkReminder);
$('reminderMask').addEventListener('click', e => { if(e.target === $('reminderMask')) closeHomeworkReminder(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('reminderMask').hidden) closeHomeworkReminder(); });

fetch('homework.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw 0; return r.json(); })
